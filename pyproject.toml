[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-to-3d"
version = "0.1.0"
description = "Reconstruct a 3D Gaussian Splatting scene from 2D photos or video captures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "plyfile>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
gsplat = ["torch>=2.1", "gsplat>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
image-to-3d = "image_to_3d.cli:main"

[tool.setuptools.packages.find]
include = ["image_to_3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
