name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,depth]"
      - name: Test
        run: pytest -q
      - name: Synthetic Gaussian Splatting demo
        run: image-to-3d demo /tmp/demo --iterations 100 --gaussians 60 --size 32 --cameras 8

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t image-to-3d .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 image-to-3d
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          curl -sf http://localhost:8000/api/health | grep -q '"ok":true'
